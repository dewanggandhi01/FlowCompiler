services:
  - type: web
    name: flowcompiler-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flowcompiler-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://flowcompiler.vercel.app

databases:
  - name: flowcompiler-db
    plan: starter
    databaseName: flowcompiler
    user: flowcompiler
